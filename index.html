<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RgamesID - Game Portfolio</title>
    <style>
        /* Gaya Dasar & Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #121212; /* Warna cadangan sebelum gambar termuat */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Overlay Gelap Agar Teks Mudah Dibaca */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        /* Konten Utama */
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        header p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        /* Dropdown Navigasi Legal Baru */
        .nav-menu {
            margin-bottom: 40px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px 20px;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
        }

        .dropdown:hover .dropbtn {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #1e1e1e;
            min-width: 180px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            z-index: 10;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 5px;
            border: 1px solid #333;
        }

        .dropdown-content a {
            color: #e0e0e0;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
            font-size: 14px;
            transition: background 0.2s;
        }

        .dropdown-content a:hover {
            background-color: #333;
            color: #fff;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Grid Daftar Game */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .game-card {
            background: rgba(30, 30, 30, 0.85);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-banner {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .game-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
        }

        .game-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .game-desc {
            font-size: 0.95rem;
            color: #bbb;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn-play {
            display: inline-block;
            width: 100%;
            padding: 12px;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: opacity 0.2s;
        }

        .btn-play:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <header>
            <h1>RgamesID Studios</h1>
            <p>Mainkan koleksi game seru kami langsung dari perangkat Anda!</p>
        </header>

        <!-- Menu Dropdown Baru untuk Kebijakan & Layanan -->
        <div class="nav-menu">
            <div class="dropdown">
                <button class="dropbtn">🛡️ Legal & Policies ▾</button>
                <div class="dropdown-content">
                    <a href="privacy-policy.html">🔒 Privacy Policy</a>
                    <a href="terms-of-service.html">📄 Terms of Service</a>
                </div>
            </div>
        </div>

        <!-- Wadah Tempat Game Dirender -->
        <main class="game-grid" id="gameGrid"></main>
    </div>

    <script>
        // Data JSON Anda dimasukkan ke dalam objek JavaScript
        const dataPortfolio = {
          "pengaturan_visual": {
            "gambar_background": "https://unsplash.com",
            "warna_tombol_steam": "#0074e4",
            "warna_tombol_mobile": "#00875a"
          },
          "daftar_game": [
           {
              "judul": "The Adventure of TED and the lost magic crystals",
              "platform": "steam",
              "link_gambar": "https://steamstatic.com",
              "deskripsi": "A cozy journey through a world of color. Join TED in this relaxing 2.5D platformer as he jumps, explores, and fights to save the Squirrel Kingdom. Solve relaxing puzzles and discover hidden treasures.",
              "link_tujuan": "https://steampowered.com"
            },
            {
              "judul": "Bro Petrux",
              "platform": "mobile",
              "link_gambar": "https://googleusercontent.com",
              "deskripsi": "Bro Petrux: Terror of boar demon - Indonesian folklore Runner Game. This exciting runner game takes you into a world full of adventure! Play as Bro Petrux.",
              "link_tujuan": "https://google.com"
            }
          ]
        };

        // 1. Terapkan Gambar Latar Belakang
        document.body.style.backgroundImage = `url('${dataPortfolio.pengaturan_visual.gambar_background}')`;

        // 2. Render Daftar Game Secara Dinamis
        const gameGrid = document.getElementById('gameGrid');
        
        dataPortfolio.daftar_game.forEach(game => {
            // Tentukan warna tombol berdasarkan platform game
            const buttonColor = game.platform === 'steam' 
                ? dataPortfolio.pengaturan_visual.warna_tombol_steam 
                : dataPortfolio.pengaturan_visual.warna_tombol_mobile;

            // Teks tombol dinamis
            const buttonText = game.platform === 'steam' ? 'Mainkan di Steam' : 'Download di Play Store';

            // Template struktur kartu game
            const gameCard = `
                <div class="game-card">
                    <img src="${game.link_gambar}" alt="${game.judul}" class="game-banner">
                    <div class="game-info">
                        <div>
                            <h2 class="game-title">${game.judul}</h2>
                            <p class="game-desc">${game.deskripsi}</p>
                        </div>
                        <a href="${game.link_tujuan}" target="_blank" class="btn-play" style="background-color: ${buttonColor}">
                            ${buttonText}
                        </a>
                    </div>
                </div>
            `;
            
            gameGrid.innerHTML += gameCard;
        });
    </script>
</body>
</html>
